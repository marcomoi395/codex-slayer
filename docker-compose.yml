services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CODEX_BROWSER: camoufox
      CODEX_CLIENT_ID: ${CODEX_CLIENT_ID:-app_EMoamEEZ73f0CkXaXp7hrann}
      CODEX_AUTHORIZATION_URL: ${CODEX_AUTHORIZATION_URL:-https://auth.openai.com/oauth/authorize}
      CODEX_TOKEN_URL: ${CODEX_TOKEN_URL:-https://auth.openai.com/oauth/token}
      CODEX_CALLBACK_HOST: ${CODEX_CALLBACK_HOST:-127.0.0.1}
      CODEX_CALLBACK_PORT: ${CODEX_CALLBACK_PORT:-1455}
      CODEX_CREATE_ACCOUNT_URL: ${CODEX_CREATE_ACCOUNT_URL:-https://auth.openai.com/create-account}
      CODEX_ACCOUNTS_FILE: /app/data/codex-accounts.json
    volumes:
      - codex-data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-5000}:80'


volumes:
  codex-data:
