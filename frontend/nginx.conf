server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /auth/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = / {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /dashboard/ {
    try_files $uri $uri/ /dashboard/index.html;
  }
}
